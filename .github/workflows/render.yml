name: render
on:
  workflow_dispatch:
    inputs:
      name:
        description: "inputs/<name>.mp3 und inputs/<name>.json"
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgbm-dev
      - run: npm install
      - run: |
          mkdir -p public out
          cp "inputs/$NAME.mp3" public/audio.mp3
          npx remotion render src/index.jsx Typo "out/$NAME.mp4" --props="inputs/$NAME.json" --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out/*.mp4
          retention-days: 14
