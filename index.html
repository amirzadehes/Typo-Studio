<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تایپوگرافی پادکست</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#f1f5f9;--mut:#94a3b8;--ac:#facc15}
*{box-sizing:border-box}
body{margin:0;padding:16px;max-width:760px;margin-inline:auto;background:var(--bg);color:var(--tx);font:16px/1.6 Tahoma,"Segoe UI",system-ui,sans-serif}
h1{font-size:22px;margin:0 0 12px}
section,details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:14px;margin-top:8px}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#111;font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#log{min-height:24px;color:var(--ac);margin-bottom:12px;white-space:pre-wrap}#log.err{color:#fb7185}
.row{border-top:1px solid var(--line);padding:10px 0}
.t{display:grid;grid-template-columns:auto 1fr 1fr 1.4fr auto;gap:6px;margin-bottom:6px}
textarea{direction:rtl}
</style>
</head>
<body>
<h1>تایپوگرافی پادکست</h1>

<details id="cfg"><summary>تنظیمات (فقط یک‌بار)</summary>
<label>Groq API Key<input id="groq" type="password" autocomplete="off"></label>
<label>GitHub Token (Contents + Actions: write)<input id="gh" type="password" autocomplete="off"></label>
<label>ریپو (مثلاً amir/typo-studio)<input id="repo" dir="ltr"></label>
</details>

<section>
<label>فایل صوتی (mp3)<input id="audio" type="file" accept=".mp3,audio/mpeg"></label>
<label>متن پادکست (اختیاری، برای اصلاح املا)<textarea id="script" rows="4"></textarea></label>
<label>نام خروجی (انگلیسی، مثلاً ep01)<input id="name" dir="ltr" placeholder="ep01"></label>
<div class="bar"><button id="go" class="p">۱. آنالیز</button></div>
</section>

<div id="log" role="status"></div>

<section id="ed" hidden>
<div id="rows"></div>
<div class="bar">
<button id="add">+ صحنه</button>
<button id="srt">دانلود SRT</button>
<button id="send" class="p">۲. ارسال و رندر</button>
</div>
</section>
<audio id="pl"></audio>

<script>
const $=s=>document.querySelector(s), G='https://api.groq.com/openai/v1';
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const S={seg:[],scenes:[],dur:0,file:null}, STY=['title','keyword','number','quote'];
['groq','gh','repo'].forEach(k=>{const e=$('#'+k);e.value=localStorage.getItem(k)||'';e.onchange=()=>localStorage.setItem(k,e.value.trim())});
const log=(m,err)=>{$('#log').textContent=m;$('#log').className=err?'err':''};
const fmt=t=>{const p=(n,l=2)=>String(n).padStart(l,'0');return `${p(Math.floor(t/3600))}:${p(Math.floor(t%3600/60))}:${p(Math.floor(t%60))},${p(Math.floor((t%1)*1000),3)}`};

$('#go').onclick=async()=>{
  const f=$('#audio').files[0], key=$('#groq').value.trim();
  if(!f||!key) return log('فایل صوتی و کلید Groq لازم است.',1);
  S.file=f; $('#pl').src=URL.createObjectURL(f);
  if(!$('#name').value) $('#name').value='ep'+Date.now().toString().slice(-6);
  try{
    log('در حال تبدیل صدا به متن…');
    const fd=new FormData();
    fd.append('file',f);fd.append('model','whisper-large-v3');fd.append('language','fa');
    fd.append('response_format','verbose_json');fd.append('timestamp_granularities[]','segment');
    let r=await fetch(G+'/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd});
    let d=await r.json(); if(!r.ok) throw new Error(d.error?.message||r.status);
    S.seg=d.segments.map(s=>({start:+s.start.toFixed(2),end:+s.end.toFixed(2),text:s.text.trim()}));
    S.dur=+(d.duration||S.seg.at(-1).end).toFixed(2);

    log('در حال انتخاب بخش‌های مهم…');
    const sys='You edit Persian kinetic-typography videos for Instagram Reels. From the numbered speech segments pick ONLY the important parts (about 30-40% of the content: hooks, key facts, numbers, punchlines). For each pick return from/to segment index (inclusive), text = short Persian on-screen text (max 10 words, condensed from the speech; fix spelling using the reference script if given) with 1-3 key words wrapped in *asterisks*, and style: title (first scene only) | keyword | number (when a figure is the point) | quote. Scenes in order, no overlap. Reply with JSON only: {"scenes":[{"from":0,"to":1,"text":"...","style":"title"}]}';
    const sc=$('#script').value.trim();
    const user=S.seg.map((s,i)=>i+': '+s.text).join('\n')+(sc?'\n\nReference script:\n'+sc:'');
    r=await fetch(G+'/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
      body:JSON.stringify({model:'openai/gpt-oss-120b',temperature:.3,reasoning_effort:'low',messages:[{role:'system',content:sys},{role:'user',content:user}]})});
    d=await r.json(); if(!r.ok) throw new Error(d.error?.message||r.status);
    const js=JSON.parse(d.choices[0].message.content.match(/\{[\s\S]*\}/)[0]), n=S.seg.length-1;
    S.scenes=js.scenes.map(c=>{
      const a=Math.max(0,Math.min(n,c.from|0)), b=Math.max(a,Math.min(n,c.to|0));
      return {start:S.seg[a].start,end:S.seg[b].end,text:c.text,style:STY.includes(c.style)?c.style:'keyword'};
    });
    draw(); $('#ed').hidden=false;
    log(`${S.scenes.length} صحنه آماده است. ویرایش کن، بعد ارسال.`);
  }catch(e){log('خطا: '+e.message,1)}
};

function draw(){
  $('#rows').innerHTML=S.scenes.map((s,i)=>`<div class="row"><div class="t">
    <button data-p="${i}" aria-label="پخش">▶</button>
    <input type="number" step=".1" value="${s.start}" data-i="${i}" data-k="start" aria-label="شروع">
    <input type="number" step=".1" value="${s.end}" data-i="${i}" data-k="end" aria-label="پایان">
    <select data-i="${i}" data-k="style">${STY.map(o=>`<option ${o==s.style?'selected':''}>${o}</option>`).join('')}</select>
    <button data-d="${i}" aria-label="حذف">✕</button></div>
    <textarea rows="2" data-i="${i}" data-k="text">${esc(s.text)}</textarea></div>`).join('');
}
$('#rows').addEventListener('input',e=>{const {i,k}=e.target.dataset;if(i!=null)S.scenes[i][k]=(k=='start'||k=='end')?+e.target.value:e.target.value});
let stopAt=0; const pl=$('#pl');
pl.ontimeupdate=()=>{if(stopAt&&pl.currentTime>=stopAt){pl.pause();stopAt=0}};
$('#rows').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.p!=null){const s=S.scenes[b.dataset.p];pl.currentTime=s.start;stopAt=s.end;pl.play()}
  if(b.dataset.d!=null){S.scenes.splice(b.dataset.d,1);draw()}
});
$('#add').onclick=()=>{const e=S.scenes.at(-1)?.end||0;S.scenes.push({start:e,end:+(e+3).toFixed(1),text:'',style:'keyword'});draw()};
$('#srt').onclick=()=>{
  const t=S.seg.map((s,i)=>`${i+1}\n${fmt(s.start)} --> ${fmt(s.end)}\n${s.text}\n`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=($('#name').value||'podcast')+'.srt';a.click();
};

const b64=async f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function put(path,content){
  const repo=$('#repo').value.trim(), H={Authorization:'Bearer '+$('#gh').value.trim(),Accept:'application/vnd.github+json'};
  const g=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{headers:H});
  const sha=g.ok?(await g.json()).sha:undefined;
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:'PUT',headers:H,body:JSON.stringify({message:'add '+path,content,sha})});
  if(!r.ok) throw new Error((await r.json()).message);
}
$('#send').onclick=async()=>{
  const name=$('#name').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')||('ep'+Date.now()), repo=$('#repo').value.trim();
  if(!repo||!$('#gh').value.trim()) return log('ریپو و GitHub Token را در تنظیمات وارد کن.',1);
  const scenes=S.scenes.filter(s=>s.text.trim()&&s.end>s.start).sort((a,b)=>a.start-b.start);
  try{
    log('ارسال فایل صوتی…'); await put(`inputs/${name}.mp3`,await b64(S.file));
    log('ارسال صحنه‌ها…');
    await put(`inputs/${name}.json`,btoa(unescape(encodeURIComponent(JSON.stringify({duration:S.dur,scenes},null,1)))));
    log('شروع رندر…');
    const r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/render.yml/dispatches`,{method:'POST',
      headers:{Authorization:'Bearer '+$('#gh').value.trim(),Accept:'application/vnd.github+json'},body:JSON.stringify({ref:'main',inputs:{name}})});
    if(!r.ok) throw new Error((await r.json()).message);
    $('#log').innerHTML=`رندر شروع شد. نتیجه (MP4) در Artifacts این صفحه است:<br><a style="color:#facc15" target="_blank" href="https://github.com/${repo}/actions">github.com/${esc(repo)}/actions</a>`;
  }catch(e){log('خطا: '+e.message,1)}
};
</script>
</body>
</html>
